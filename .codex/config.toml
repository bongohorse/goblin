# Project-only browser automation. Enable locally only when Codex runs on Windows.
# Do not enable this Windows Edge launcher inside the Linux devcontainer.
[mcp_servers.goblin_windows_browser]
command = "npx"
args = ["-y", "@playwright/mcp@0.0.83", "--browser", "msedge", "--isolated", "--caps", "vision"]
enabled = false
startup_timeout_sec = 60
tool_timeout_sec = 60
