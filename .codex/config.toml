# Project-only browser automation. Enable locally only when Codex runs on Windows.
# Chrome Portable only; local config is mandatory. Do not enable in Linux.
[mcp_servers.goblin_windows_browser]
command = "npx"
args = ["-y", "@playwright/mcp@0.0.83", "--config", ".codex/chrome-portable.local.json", "--isolated", "--caps", "vision"]
enabled = false
startup_timeout_sec = 60
tool_timeout_sec = 60
